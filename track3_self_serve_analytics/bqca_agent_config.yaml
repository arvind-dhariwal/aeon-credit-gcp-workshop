# =============================================================================
# BIGQUERY CONVERSATIONAL ANALYTICS (BQCA) & PROPERTY GRAPH AGENT CONFIGURATION
# Fulfils ACSM RFP Clauses C1.1.2.9, C1.1.2.10, and Annexure M (M1.4.2, M1.4.4)
# Used by Track 1 Notebook 05 (`05_BigQuery_Graph_and_BQCA_Agent.ipynb`)
# =============================================================================

agent_id: "acsm-aeon360-bqca-agent"
display_name: "ACSM AEON360 Conversational Analytics & Graph Agent"
target_tables:
  - "acsm_gold.gold_aeon_customer360_profile"
  - "acsm_gold.gold_underwriting_funnel"
  - "acsm_gold.gold_collections_risk"
  - "acsm_silver.recon_audit_log"
target_property_graph: "acsm_gold.acsm_credit_ecosystem_graph"

system_instructions: |
  You are the official AEON360 Conversational Analytics Assistant for AEON Credit Service (M) Berhad (ACSM).
  All monetary amounts are in Malaysian Ringgit (MYR / RM).
  Always use these ACSM & Bank Negara Malaysia (BNM) domain definitions:
  - EP: Easy Payment (installment financing for motorcycles, appliances, and personal financing).
  - CC: Credit Card products (Platinum, Gold, Silver, Basic tiers).
  - CIF_ID: Customer Information File unique customer identifier from m3CIF.
  - OSP: Outstanding Principal balance (billing_osp_myr = billed principal, collection_osp_myr = collected principal, unpaid_osp_myr = overdue unpaid principal).
  - Collection Efficiency Ratio: SAFE_DIVIDE(SUM(collection_osp_myr), NULLIF(SUM(billing_osp_myr), 0)).
  - AKPK: Agensi Kaunseling dan Pengurusan Kredit (Malaysian credit counseling and debt restructuring program; akpk_indicator = 'Y' or akpk_status = 'Y' indicates debt restructuring).
  - DSR: Debt Service Ratio (monthly debt obligations divided by net income; new_dsr / avg_ep_new_dsr).
  - FinPlus: ACSM's internal e-credit evaluation tier (finplus_tier).
  - PDPA Consent: Malaysian Personal Data Protection Act marketing opt-in flag (RecvPromo_FG = 'Y').

golden_sql_examples:
  - id: "Q01_PORTFOLIO_DELINQUENCY_BY_STATE"
    question: "What is our total Billing OSP, Collection OSP, Unpaid OSP, and Collection Efficiency Ratio across Malaysian states?"
    sql: |
      SELECT
        state,
        product_line,
        ROUND(SUM(billing_osp_myr), 2) AS total_billing_osp_myr,
        ROUND(SUM(collection_osp_myr), 2) AS total_collection_osp_myr,
        ROUND(SUM(unpaid_osp_myr), 2) AS total_unpaid_osp_myr,
        ROUND(SAFE_DIVIDE(SUM(collection_osp_myr), NULLIF(SUM(billing_osp_myr), 0)) * 100, 2) AS collection_efficiency_pct
      FROM `acsm_gold.gold_collections_risk`
      GROUP BY state, product_line
      ORDER BY total_unpaid_osp_myr DESC;

  - id: "Q02_UNDERWRITING_APPROVAL_FUNNEL"
    question: "Compare credit application volume, average credit score, and average DSR between Easy Payment (EP) and Credit Cards (CC) by channel."
    sql: |
      SELECT
        product_line,
        application_channel,
        decision_status,
        COUNT(*) AS application_count,
        ROUND(AVG(credit_score), 1) AS avg_credit_score,
        ROUND(AVG(new_dsr), 2) AS avg_new_dsr,
        ROUND(SUM(requested_or_approved_exposure_myr), 2) AS total_exposure_myr
      FROM `acsm_gold.gold_underwriting_funnel`
      GROUP BY product_line, application_channel, decision_status
      ORDER BY product_line, application_count DESC;

  - id: "Q03_EP_TO_CC_CROSS_SELL_CANDIDATES"
    question: "Find top Easy Payment (EP) customers with zero unpaid delinquency, net income above RM 5,000, and PDPA marketing consent who do not hold an active Credit Card yet."
    sql: |
      SELECT
        CIF_ID,
        State,
        Occupation,
        B_NetIncome,
        ep_app_count,
        total_ep_financed_myr,
        avg_ep_new_dsr
      FROM `acsm_gold.gold_aeon_customer360_profile`
      WHERE active_card_count = 0
        AND ep_app_count > 0
        AND combined_unpaid_osp = 0
        AND B_NetIncome >= 5000
        AND RecvPromo_FG = 'Y'
      ORDER BY B_NetIncome DESC
      LIMIT 50;

  - id: "Q04_GQL_MERCHANT_DELINQUENCY_CONTAGION"
    question: "Which merchants have the highest number of delinquent customers transacting there in our BigQuery Property Graph?"
    sql: |
      SELECT
        merchant_name,
        merchant_group,
        COUNT(DISTINCT cif_id) AS delinquent_customers_count,
        ROUND(SUM(total_spend_myr), 2) AS delinquent_customer_spend_myr,
        ROUND(SUM(combined_unpaid_osp_myr), 2) AS linked_unpaid_osp_myr
      FROM GRAPH_TABLE(
        `acsm_gold.acsm_credit_ecosystem_graph`
        MATCH (c:Customer)-[t:TRANSACTED_AT]->(m:Merchant)
        WHERE c.is_delinquent = TRUE
        COLUMNS (
          c.cif_id AS cif_id,
          c.combined_unpaid_osp_myr AS combined_unpaid_osp_myr,
          t.total_spend_myr AS total_spend_myr,
          m.merchant_name AS merchant_name,
          m.merchant_group AS merchant_group
        )
      )
      GROUP BY merchant_name, merchant_group
      ORDER BY linked_unpaid_osp_myr DESC
      LIMIT 15;
